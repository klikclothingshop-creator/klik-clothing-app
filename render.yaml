services:
  - type: web
    name: klik-clothing-app
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: ADMIN_PIN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: SHIPPING_FLAT_CENTS
        value: "800"
      - key: NODE_VERSION
        value: "20"
